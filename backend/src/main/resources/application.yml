spring:
  application:
    name: fraud-detection-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/frauddetection}
    username: ${DB_USERNAME:frauddetection}
    password: ${DB_PASSWORD:frauddetection}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

fraud:
  ml-service:
    url: ${ML_SERVICE_URL:http://localhost:8001}
  decision:
    review-threshold: 0.3
    decline-threshold: 0.85

springdoc:
  swagger-ui:
    path: /swagger-ui.html
