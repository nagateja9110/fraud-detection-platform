<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fraud Risk Console</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #131a23;
    --border: #232e3d;
    --text: #e6edf3;
    --muted: #8b98a9;
    --accent: #3b82f6;
    --low: #16a34a;
    --medium: #ca8a04;
    --high: #ea580c;
    --critical: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  header h1 { font-size: 18px; margin: 0; }
  header span { color: var(--muted); font-size: 13px; }
  main {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 20px;
    padding: 20px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
  }
  .panel h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 14px;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin: 10px 0 4px;
  }
  input, select {
    width: 100%;
    padding: 8px 10px;
    background: #0e141c;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 14px;
  }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  button {
    cursor: pointer;
    border: none;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 600;
  }
  .btn-primary { background: var(--accent); color: white; width: 100%; margin-top: 16px; }
  .btn-secondary { background: #1e293b; color: var(--text); border: 1px solid var(--border); }
  .demo-buttons { display: flex; gap: 8px; margin-top: 8px; }
  .demo-buttons button { flex: 1; }

  .result { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.03em;
  }
  .badge.LOW { background: rgba(22,163,74,0.15); color: var(--low); }
  .badge.MEDIUM { background: rgba(202,138,4,0.15); color: var(--medium); }
  .badge.HIGH { background: rgba(234,88,12,0.15); color: var(--high); }
  .badge.CRITICAL { background: rgba(220,38,38,0.15); color: var(--critical); }
  .badge.APPROVE { background: rgba(22,163,74,0.15); color: var(--low); }
  .badge.REVIEW { background: rgba(202,138,4,0.15); color: var(--medium); }
  .badge.DECLINE { background: rgba(220,38,38,0.15); color: var(--critical); }

  .prob-bar-track { background: #0e141c; border-radius: 999px; height: 8px; margin: 8px 0 4px; overflow: hidden; }
  .prob-bar-fill { height: 100%; border-radius: 999px; transition: width 0.3s ease; }

  .factor { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .factor:last-child { border-bottom: none; }
  .factor .desc { color: var(--muted); }
  .factor .contrib { font-family: ui-monospace, monospace; color: var(--accent); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 500; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
  tr.flash { animation: flash-in 1.2s ease-out; }
  @keyframes flash-in { from { background: rgba(59,130,246,0.25); } to { background: transparent; } }

  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  .error { color: var(--critical); font-size: 13px; margin-top: 10px; }
</style>
</head>
<body>
<header>
  <h1>Fraud Risk Console</h1>
  <span>Live view of the Spring Boot + FastAPI/XGBoost fraud detection pipeline</span>
</header>
<main>
  <section class="panel">
    <h2>Submit a transaction</h2>
    <form id="txn-form">
      <label>Account number</label>
      <input name="accountNumber" value="acct-demo-1" required>

      <div class="row">
        <div>
          <label>Home country</label>
          <input name="homeCountry" value="US">
        </div>
        <div>
          <label>Transaction country</label>
          <input name="country" value="US">
        </div>
      </div>

      <label>Device fingerprint</label>
      <input name="deviceFingerprint" value="device-known" required>

      <div class="row">
        <div>
          <label>Amount (USD)</label>
          <input name="amount" type="number" step="0.01" value="42.50" required>
        </div>
        <div>
          <label>Channel</label>
          <select name="channel">
            <option>POS</option>
            <option>ONLINE</option>
            <option>ATM</option>
          </select>
        </div>
      </div>

      <label>Merchant category</label>
      <select name="merchantCategory">
        <option value="grocery">grocery</option>
        <option value="restaurant">restaurant</option>
        <option value="subscription">subscription</option>
        <option value="travel">travel</option>
        <option value="electronics">electronics</option>
        <option value="gift_card">gift_card</option>
        <option value="jewelry">jewelry</option>
        <option value="gambling">gambling</option>
      </select>

      <button type="submit" class="btn-primary">Score transaction</button>
    </form>

    <div class="demo-buttons">
      <button type="button" class="btn-secondary" id="btn-normal">Simulate normal txn</button>
      <button type="button" class="btn-secondary" id="btn-burst">Simulate fraud burst</button>
    </div>

    <div id="result-panel" class="result" style="display:none">
      <div id="result-badges"></div>
      <div class="prob-bar-track"><div id="prob-bar" class="prob-bar-fill"></div></div>
      <div id="prob-label" style="font-size:12px;color:var(--muted)"></div>
      <div id="factors" style="margin-top:12px"></div>
    </div>
    <div id="error" class="error"></div>
  </section>

  <section class="panel">
    <h2>Recent transactions <span id="live-dot" style="color:var(--low)">&#9679;</span></h2>
    <table>
      <thead>
        <tr><th>Account</th><th>Amount</th><th>Merchant</th><th>Channel</th><th>Risk</th><th>Decision</th><th>Time</th></tr>
      </thead>
      <tbody id="txn-rows"></tbody>
    </table>
    <div id="empty-state" class="empty">No transactions yet — submit one on the left.</div>
  </section>
</main>

<script>
const API = "";
const seen = new Set();

function badge(cls, text) {
  return `<span class="badge ${cls}">${text}</span>`;
}

function probColor(p) {
  if (p < 0.3) return "var(--low)";
  if (p < 0.6) return "var(--medium)";
  if (p < 0.85) return "var(--high)";
  return "var(--critical)";
}

function renderResult(data) {
  document.getElementById("error").textContent = "";
  document.getElementById("result-panel").style.display = "block";
  document.getElementById("result-badges").innerHTML =
    badge(data.riskLevel, data.riskLevel) + " " + badge(data.decision, data.decision);

  const pct = (data.fraudProbability * 100).toFixed(1);
  const bar = document.getElementById("prob-bar");
  bar.style.width = pct + "%";
  bar.style.background = probColor(data.fraudProbability);
  document.getElementById("prob-label").textContent =
    `fraud probability: ${pct}%  ·  model ${data.modelVersion}  ·  ${data.mlLatencyMs.toFixed(1)}ms`;

  const factors = data.topRiskFactors || [];
  document.getElementById("factors").innerHTML = factors.length
    ? factors.map(f => `<div class="factor"><span class="desc">${f.description}</span><span class="contrib">+${f.contribution.toFixed(3)}</span></div>`).join("")
    : `<div class="factor"><span class="desc">No significant risk factors</span></div>`;
}

async function submitTransaction(payload) {
  try {
    const resp = await fetch(`${API}/api/transactions`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      document.getElementById("error").textContent = err.message || `Request failed (${resp.status})`;
      return;
    }
    const data = await resp.json();
    renderResult(data);
    await refreshFeed();
  } catch (e) {
    document.getElementById("error").textContent = "Could not reach the API: " + e.message;
  }
}

document.getElementById("txn-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const form = new FormData(e.target);
  submitTransaction({
    accountNumber: form.get("accountNumber"),
    homeCountry: form.get("homeCountry"),
    country: form.get("country"),
    deviceFingerprint: form.get("deviceFingerprint"),
    amount: parseFloat(form.get("amount")),
    channel: form.get("channel"),
    merchantCategory: form.get("merchantCategory"),
    ownerName: "Demo User"
  });
});

document.getElementById("btn-normal").addEventListener("click", () => {
  const suffix = Math.floor(Math.random() * 10000);
  submitTransaction({
    accountNumber: `acct-normal-${suffix}`,
    ownerName: "Demo User",
    homeCountry: "US",
    country: "US",
    deviceFingerprint: `device-trusted-${suffix}`,
    amount: +(20 + Math.random() * 60).toFixed(2),
    channel: "POS",
    merchantCategory: "grocery"
  });
});

document.getElementById("btn-burst").addEventListener("click", async () => {
  const suffix = Math.floor(Math.random() * 10000);
  const account = `acct-burst-${suffix}`;
  for (let i = 0; i < 5; i++) {
    await submitTransaction({
      accountNumber: account,
      ownerName: "Demo User",
      homeCountry: "US",
      country: "RO",
      deviceFingerprint: `device-fraud-${suffix}`,
      amount: +(600 + Math.random() * 500).toFixed(2),
      channel: "ONLINE",
      merchantCategory: "gift_card"
    });
    await new Promise(r => setTimeout(r, 400));
  }
});

async function refreshFeed() {
  try {
    const resp = await fetch(`${API}/api/transactions?size=25`);
    if (!resp.ok) return;
    const page = await resp.json();
    const rows = page.content || [];
    document.getElementById("empty-state").style.display = rows.length ? "none" : "block";

    document.getElementById("txn-rows").innerHTML = rows.map(r => {
      const isNew = !seen.has(r.transactionId);
      seen.add(r.transactionId);
      const time = new Date(r.occurredAt).toLocaleTimeString();
      return `<tr class="${isNew ? 'flash' : ''}">
        <td>${r.accountNumber}</td>
        <td>$${r.amount.toFixed(2)}</td>
        <td>${r.merchantCategory}</td>
        <td>${r.channel}</td>
        <td>${badge(r.riskLevel, r.riskLevel)}</td>
        <td>${badge(r.decision, r.decision)}</td>
        <td>${time}</td>
      </tr>`;
    }).join("");
  } catch (e) {
    // polling failure is non-fatal; next tick retries
  }
}

refreshFeed();
setInterval(refreshFeed, 3000);
</script>
</body>
</html>
