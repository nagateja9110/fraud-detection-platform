services:
  postgres:
    image: postgres:16-alpine
    container_name: frauddetection-postgres
    environment:
      POSTGRES_DB: frauddetection
      POSTGRES_USER: frauddetection
      POSTGRES_PASSWORD: ${DB_PASSWORD:-frauddetection}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - frauddetection_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frauddetection -d frauddetection"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: frauddetection-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml-service:
    build: ./ml-service
    container_name: frauddetection-ml-service
    volumes:
      - ./ml-service/models:/app/models:ro
    ports:
      - "${ML_SERVICE_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    container_name: frauddetection-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/frauddetection
      DB_USERNAME: frauddetection
      DB_PASSWORD: ${DB_PASSWORD:-frauddetection}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ML_SERVICE_URL: http://ml-service:8000
      SERVER_PORT: 8080
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  frauddetection_pgdata:
